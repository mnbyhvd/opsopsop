server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    # Serve the admin SPA (fallback to /index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets map to /usr/share/nginx/html/static
    location /static/ {
        alias /usr/share/nginx/html/static/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy images (if needed from backend uploads)
    location /images/ {
        proxy_pass http://opsopsop-backend:3001/images/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://opsopsop-backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
