map $http_user_agent $prerender_mode {
    default "spa";
    ~*(yandex|googlebot|google-inspectiontool|bingbot|duckduckbot|slurp|baiduspider|crawler|spider|facebookexternalhit|vkshare|telegrambot|twitterbot|whatsapp) "bot";
}

map $uri $prerender_file {
    "/" "/prerendered/index.html";
    default "/prerendered$uri/index.html";
}

map $prerender_mode $prerender_candidate {
    default "/__no_prerender__.html";
    "bot" $prerender_file;
}

server {
    listen 80;
    server_name localhost;
    
    # Serve favicon
    location = /favicon.ico {
        root /usr/share/nginx/html;
        try_files /М_Logo.ico =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Serve favicon with cyrillic name
    location ~ ^/М_Logo\.ico$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Prerendered pages are an internal SEO layer of the main site, not a public path.
    location ^~ /prerendered/ {
        return 404;
    }
    
    # Serve pre-rendered HTML if available, otherwise fall back to SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header X-SPS-Prerender $prerender_mode always;
        try_files $prerender_candidate $uri $uri/ /index.html;
    }

    # Sitemap generated by prerender script
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        try_files /prerendered/sitemap.xml =404;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        try_files /prerendered/robots.txt /robots.txt =404;
    }
    
    # Serve static assets with correct MIME types
    location /static/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Serve images from frontend public folder
    location /images/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    
    # Serve videos from frontend public folder
    location /videos/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }
    
    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://opsopsop-backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
