services:
  db:
    image: mysql:8.0
    container_name: opsopsop-db
    environment:
      MYSQL_ROOT_PASSWORD: MasterSPS2024!
      MYSQL_DATABASE: master_sps
      MYSQL_USER: master_sps_user
      MYSQL_PASSWORD: MasterSPS2024!
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/migration_fix.sql:/docker-entrypoint-initdb.d/migration_fix.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pMasterSPS2024!"]
      timeout: 20s
      retries: 10
    networks:
      - master_sps_network

  backend:
    build: ./backend
    container_name: opsopsop-backend
    environment:
      NODE_ENV: production
      DB_HOST: opsopsop-db
      DB_PORT: 3306
      DB_NAME: master_sps
      DB_USER: master_sps_user
      DB_PASSWORD: MasterSPS2024!
      JWT_SECRET: your-super-secret-jwt-key-here
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - master_sps_network

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ""
    container_name: opsopsop-frontend
    expose:
      - "80"
    volumes:
      - prerendered_html:/usr/share/nginx/html/prerendered
    networks:
      - master_sps_network

  admin:
    build: 
      context: ./admin
      args:
        REACT_APP_API_URL: ""
    container_name: opsopsop-admin
    expose:
      - "80"
    networks:
      - master_sps_network

  nginx:
    image: nginx:alpine
    container_name: opsopsop-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-full.conf:/etc/nginx/nginx.conf
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - ./ssl:/etc/nginx/ssl
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend
      - admin
    networks:
      - master_sps_network

  prerender:
    build: ./prerender
    container_name: opsopsop-prerender
    user: root
    environment:
      FRONTEND_URL: http://opsopsop-frontend
      API_URL: http://opsopsop-backend:3001
      OUTPUT_DIR: /prerendered
      SITE_URL: https://sps-master.ru
    volumes:
      - prerendered_html:/prerendered
    depends_on:
      - frontend
      - backend
    networks:
      - master_sps_network
    profiles:
      - prerender

  certbot:
    image: certbot/certbot
    container_name: opsopsop-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - nginx
    network_mode: bridge
    # Команда запускается только при явном вызове через docker compose run
    # Для автоматического обновления используйте cron или systemd timer
    command: certonly --webroot --webroot-path=/var/www/certbot --email vikulindmitrii@yandex.ru --agree-tos --no-eff-email -d sps-master.ru --keep-until-expiring
    profiles:
      - certbot

volumes:
  mysql_data:
  certbot_webroot:
  prerendered_html:

networks:
  master_sps_network:
    driver: bridge